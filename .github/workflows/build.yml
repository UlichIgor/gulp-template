name: Gulp build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run production build
        run: npm run prod
      - name: Verify generated website and course
        run: |
          test -s dist/index.html
          test -s dist/course/index.html
          test -s dist/course/course.css
          test -s dist/course/course.js
